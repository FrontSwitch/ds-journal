name: Build

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri

      - name: Set OpenSSL dir (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $dir = Split-Path (Get-Command openssl.exe).Path -Parent | Split-Path -Parent
          "OPENSSL_DIR=$dir" | Out-File -Append $env:GITHUB_ENV
          "OPENSSL_LIB_DIR=$dir\lib\VC\x64\MD" | Out-File -Append $env:GITHUB_ENV

      - name: Install dependencies
        run: npm ci

      - name: Build (release)
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: DSJ ${{ github.ref_name }}
          releaseBody: Early access release.
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
